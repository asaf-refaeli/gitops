# Wrapper chart around the upstream Argo CD chart. Used twice, on purpose:
#   1. scripts/bootstrap.sh installs it once with Helm (release "argo-cd").
#   2. bootstrap/apps/argocd.yaml points Argo CD at this same folder with the
#      same release name, so Argo CD adopts its own install and every later
#      upgrade or config change is a commit here.
# Same chart, version and values in both places, so the adoption changes
# nothing and the version cannot drift between the script and Git.
#
# Argo CD's repo-server runs `helm dependency build` itself on each render; it
# needs egress to https://argoproj.github.io/argo-helm.
apiVersion: v2
name: argocd
description: Argo CD, installed from the upstream chart and managed by itself.
type: application
version: 0.1.0

dependencies:
  - name: argo-cd
    # Chart 10.18.2 == Argo CD v3.6.2. Pinned: a bump is a reviewable commit,
    # not a surprise on the next sync.
    version: 10.18.2
    repository: https://argoproj.github.io/argo-helm
