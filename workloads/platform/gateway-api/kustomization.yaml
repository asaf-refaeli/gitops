apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Upstream Gateway API, standard channel, pinned to a release. v1.6.3, not
  # the newer v1.7.0: it is the version Traefik v3.7 documents support for
  # ("supports Standard version v1.6.3", Traefik's Kubernetes Gateway provider
  # docs). Bump it together with Traefik.
  # Contents: the CRDs (GatewayClass, Gateway, HTTPRoute, ...) and a
  # ValidatingAdmissionPolicy that blocks installing older CRDs over newer ones.
  # Traefik's chart does not bundle these CRDs, so this app is their only owner.
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/standard-install.yaml
