# dev environment values, merged over release-notes/chart/values.yaml.
# Only what dev sets; the two envs differ only in this file and values-prod.yaml.

image:
  # The same build as prod. Empty for now (the chart falls back to its
  # appVersion); replaced by the CI-written sha-<commit> tag + digest.
  tag: ""
  digest: ""

# One pod, no HPA: dev only has to prove the build runs.
replicaCount: 1
autoscaling:
  enabled: false

# Off: with one replica a PDB protects nothing.
podDisruptionBudget:
  enabled: false

logLevel: DEBUG

# HTTPRoute attached to the platform's Gateway (workloads/platform/traefik).
route:
  enabled: true
  hostname: dev.localhost
  gateway:
    name: web
    namespace: traefik

postgres:
  storage:
    # Same as the chart default, stated so the two envs compare side by side.
    size: 1Gi
