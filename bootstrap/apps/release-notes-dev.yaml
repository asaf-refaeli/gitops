# release-notes, dev environment: Helm chart from the app repo, values from
# this repo. Differs from release-notes-prod.yaml only in name, namespace and
# values file; every other environment difference lives in the values files.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: release-notes-dev
  namespace: argocd
  annotations:
    # Last: needs the Gateway (traefik) for its HTTPRoute and the metrics API
    # (metrics-server), both wave 1.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    # Deleting this Application also deletes the resources it deployed.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: release-notes
  sources:
    # The chart, versioned with the app code.
    - repoURL: https://github.com/asaf-refaeli/release-notes.git
      # Becomes the chart's release tag once one is pushed; main until then.
      targetRevision: main
      path: chart
      helm:
        releaseName: release-notes
        # $values is the root of the source below (ref: values).
        valueFiles:
          - $values/workloads/apps/release-notes/values-dev.yaml
    # This repo, only as the source of the values file; nothing is rendered from it.
    - repoURL: https://github.com/asaf-refaeli/kind-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: release-notes-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Argo CD creates the namespace with these labels, so the API server
    # rejects pods that do not meet the Pod Security "restricted" profile.
    # It exists before the chart's PreSync hooks (the DB Secret Job) run.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
