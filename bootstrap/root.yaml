# The single seed of the whole GitOps setup, applied once by bootstrap.sh:
#
#   kubectl apply -f bootstrap/root.yaml
#
# It syncs this directory (recursively), which creates:
#   - the two AppProjects                          (sync-wave -1)
#   - one Application per file in bootstrap/apps/  (sync-waves 0, 1, 2)
#   - this Application itself: it sits inside the path it syncs, so from here
#     on Argo CD manages and self-heals root from Git too.
#
# The waves only wait for each child to be Healthy because of the Application
# health check in workloads/platform/argocd/values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    # Cascade delete: deleting root deletes the Applications it created. Each
    # child then cleans up only if it has the finalizer too (the argocd
    # Application deliberately does not, so Argo CD itself survives).
    - resources-finalizer.argocd.argoproj.io
spec:
  # 'default' is the only project that exists at bootstrap time; the
  # 'platform' and 'release-notes' projects are created by this app.
  project: default
  source:
    repoURL: https://github.com/asaf-refaeli/gitops.git
    targetRevision: main
    path: bootstrap
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # Removing a file from bootstrap/ removes that Application.
      prune: true
      # A hand edit to an Application or project is reverted to Git.
      selfHeal: true
    syncOptions:
      # Field-level ownership instead of a last-applied annotation. Same
      # options on every Application in this repo.
      - ServerSideApply=true
      # Delete removed resources only after the rest of the sync succeeds.
      - PruneLast=true
